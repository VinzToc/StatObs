<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA -->
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Observation EPS">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Panneau de Saisie - Observation du pratiquant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            font-size: 1.4em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 0.9em;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.3em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* ③ Légende couleur dans le panneau */
        .color-legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 0.82em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #555;
        }

        .legend-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
        }

        .legend-dot.positive { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .legend-dot.negative { background: linear-gradient(135deg, #f5576c, #f093fb); }

        /* ── Grille des boutons ── */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            flex: 1;
            margin-bottom: 20px;
            align-content: start;
        }

        .action-button {
            color: white;
            border: none;
            border-radius: 15px;
            padding: 20px 15px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 100px;
            user-select: none;
        }

        .action-button:active {
            transform: scale(0.95);
        }

        /* ③ Couleurs selon polarité */
        .action-button.positive-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.35);
        }

        /* Nuances de vert pour différencier les boutons positifs */
        .action-button.positive-btn:nth-child(1)  { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .action-button.positive-btn:nth-child(2)  { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .action-button.positive-btn:nth-child(3)  { background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); }
        .action-button.positive-btn:nth-child(4)  { background: linear-gradient(135deg, #1d976c 0%, #93f9b9 100%); }
        .action-button.positive-btn:nth-child(5)  { background: linear-gradient(135deg, #2af598 0%, #009efd 100%); }
        .action-button.positive-btn:nth-child(6)  { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); }
        .action-button.positive-btn:nth-child(7)  { background: linear-gradient(135deg, #76b852 0%, #8dc26f 100%); }
        .action-button.positive-btn:nth-child(8)  { background: linear-gradient(135deg, #0acffe 0%, #495aff 100%); }

        .action-button.negative-btn {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.35);
        }

        /* Nuances de rouge/chaud pour différencier les boutons négatifs */
        .action-button.negative-btn:nth-child(1)  { background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%); }
        .action-button.negative-btn:nth-child(2)  { background: linear-gradient(135deg, #e52d27 0%, #b31217 100%); }
        .action-button.negative-btn:nth-child(3)  { background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%); }
        .action-button.negative-btn:nth-child(4)  { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); }
        .action-button.negative-btn:nth-child(5)  { background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%); }
        .action-button.negative-btn:nth-child(6)  { background: linear-gradient(135deg, #c0392b 0%, #8e44ad 100%); }
        .action-button.negative-btn:nth-child(7)  { background: linear-gradient(135deg, #f09819 0%, #edde5d 100%); }
        .action-button.negative-btn:nth-child(8)  { background: linear-gradient(135deg, #d31027 0%, #ea384d 100%); }

        .button-count {
            font-size: 2em;
            font-weight: 700;
            background: rgba(255,255,255,0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-label {
            font-size: 0.9em;
            text-align: center;
            line-height: 1.2;
        }

        /* ③ Badge polarité sur chaque bouton */
        .polarity-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            font-size: 0.75em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .action-button {
            position: relative;
        }

        /* ── Boutons de contrôle ── */
        .footer-buttons {
            display: flex;
            gap: 10px;
        }

        .control-button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-finish {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .control-button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .button-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 1.2em; }
            .subtitle { font-size: 0.85em; }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .button-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Actions motrices et actions de jeu</h1>
            <p class="subtitle">Observez le sportif et cliquez sur le bouton correspondant aux actions observées. Chaque action = 1 clic ; un clic long annule la dernière action enregistrée</p>
        </header>

        <div class="info-bar">
            <div class="info-item">
                <div class="info-label">Chronomètre</div>
                <div class="info-value" id="chrono">00:00</div>
            </div>
            <div class="info-item">
                <div class="info-label">Sportif observé</div>
                <div class="info-value" id="playerName">-</div>
            </div>
        </div>

        <!-- ③ Légende couleur -->
        <div class="color-legend">
            <div class="legend-item">
                <div class="legend-dot positive"></div>
                <span>Observable positif (point fort)</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot negative"></div>
                <span>Observable négatif (point faible)</span>
            </div>
        </div>

        <div class="button-grid" id="buttonGrid"></div>

        <div class="footer-buttons">
            <button class="control-button btn-reset"  id="resetBtn">Réinitialiser</button>
            <button class="control-button btn-finish" id="finishBtn">Session terminée ?</button>
        </div>
    </div>

    <script>
        const config    = JSON.parse(localStorage.getItem('observationConfig'));
        const startTime = parseInt(localStorage.getItem('startTime'));
        let counts      = JSON.parse(localStorage.getItem('observationCounts')) || {};
        let chronoInterval, longPressTimer;
        let isLongPress = false;

        if (!config) {
            alert('Erreur : Aucune configuration trouvée. Retour à la page d\'accueil.');
            window.location.href = 'index.html';
        }

        document.getElementById('playerName').textContent = config.joueur;

        // Chronomètre
        function updateChrono() {
            const elapsed  = Date.now() - startTime;
            const minutes  = Math.floor(elapsed / 60000);
            const seconds  = Math.floor((elapsed % 60000) / 1000);
            document.getElementById('chrono').textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        chronoInterval = setInterval(updateChrono, 1000);
        updateChrono();

        // ③ Génération des boutons colorés selon la polarité
        const buttonGrid = document.getElementById('buttonGrid');

        // Séparer positifs et négatifs pour appliquer nth-child correctement
        // On les insère dans deux conteneurs virtuels puis on recompose
        const positiveButtons = [];
        const negativeButtons = [];

        for (let i = 0; i < config.nbObservables; i++) {
            const polarity  = (config.polarity && config.polarity[i]) || 'positive';
            const isNeg     = polarity === 'negative';

            const button    = document.createElement('button');
            button.className = `action-button ${isNeg ? 'negative-btn' : 'positive-btn'}`;
            button.dataset.index = i + 1;

            // Badge polarité
            const badge = document.createElement('div');
            badge.className = 'polarity-badge';
            badge.textContent = isNeg ? '–' : '+';

            const countDiv = document.createElement('div');
            countDiv.className = 'button-count';
            countDiv.textContent = counts[`item${i + 1}`] || 0;

            const labelDiv = document.createElement('div');
            labelDiv.className = 'button-label';
            labelDiv.textContent = config.items[i];

            button.appendChild(badge);
            button.appendChild(countDiv);
            button.appendChild(labelDiv);

            if (isNeg) negativeButtons.push(button);
            else        positiveButtons.push(button);
        }

        // Insertion : d'abord positifs, puis négatifs
        // (nth-child s'applique dans l'ordre d'insertion dans buttonGrid)
        [...positiveButtons, ...negativeButtons].forEach(btn => buttonGrid.appendChild(btn));

        // Événements sur tous les boutons
        document.querySelectorAll('.action-button').forEach(button => {

            // Clic court → incrément
            button.addEventListener('click', function () {
                if (!isLongPress) {
                    const index = `item${this.dataset.index}`;
                    counts[index] = (counts[index] || 0) + 1;
                    this.querySelector('.button-count').textContent = counts[index];
                    localStorage.setItem('observationCounts', JSON.stringify(counts));
                }
                isLongPress = false;
            });

            // Clic long → décrement
            button.addEventListener('mousedown', function () {
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    const index = `item${this.dataset.index}`;
                    if (counts[index] > 0) {
                        counts[index]--;
                        this.querySelector('.button-count').textContent = counts[index];
                        localStorage.setItem('observationCounts', JSON.stringify(counts));
                        this.style.transform = 'scale(1.1)';
                        setTimeout(() => { this.style.transform = ''; }, 200);
                    }
                }, 500);
            });

            button.addEventListener('mouseup',    () => clearTimeout(longPressTimer));
            button.addEventListener('mouseleave', () => { clearTimeout(longPressTimer); isLongPress = false; });

            // Support tactile
            button.addEventListener('touchstart', function (e) {
                e.preventDefault();
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    const index = `item${this.dataset.index}`;
                    if (counts[index] > 0) {
                        counts[index]--;
                        this.querySelector('.button-count').textContent = counts[index];
                        localStorage.setItem('observationCounts', JSON.stringify(counts));
                        this.style.transform = 'scale(1.1)';
                        setTimeout(() => { this.style.transform = ''; }, 200);
                    }
                }, 500);
            });

            button.addEventListener('touchend', function (e) {
                e.preventDefault();
                clearTimeout(longPressTimer);
                if (!isLongPress) {
                    const index = `item${this.dataset.index}`;
                    counts[index] = (counts[index] || 0) + 1;
                    this.querySelector('.button-count').textContent = counts[index];
                    localStorage.setItem('observationCounts', JSON.stringify(counts));
                }
                setTimeout(() => isLongPress = false, 100);
            });
        });

        // Réinitialiser
        document.getElementById('resetBtn').addEventListener('click', function () {
            if (confirm('Êtes-vous sûr de vouloir réinitialiser tous les compteurs ?')) {
                for (let i = 1; i <= config.nbObservables; i++) counts[`item${i}`] = 0;
                document.querySelectorAll('.button-count').forEach(c => c.textContent = '0');
                localStorage.setItem('observationCounts', JSON.stringify(counts));
            }
        });

        // Session terminée
        document.getElementById('finishBtn').addEventListener('click', function () {
            if (confirm('Terminer la session et enregistrer les données ?')) {
                clearInterval(chronoInterval);
                const elapsed  = Date.now() - startTime;
                const minutes  = Math.floor(elapsed / 60000);
                const seconds  = Math.floor((elapsed % 60000) / 1000);
                const duration = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                const finalData = { ...config, duration, counts, timestamp: Date.now() };
                localStorage.setItem('observationFinalData', JSON.stringify(finalData));
                window.removeEventListener('beforeunload', warnLeave);
                window.location.href = 'statistiques.html';
            }
        });

        // Protège contre une fermeture accidentelle pendant l'observation
        function warnLeave(e) {
            e.preventDefault();
            e.returnValue = '';
        }
        window.addEventListener('beforeunload', warnLeave);

        // Garde l'écran allumé pendant l'observation (si le navigateur le permet)
        let wakeLock = null;
        async function keepAwake() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (e) { /* non bloquant */ }
        }
        keepAwake();
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') keepAwake();
        });
    </script>
    <script src="pwa.js"></script>
</body>
</html>
